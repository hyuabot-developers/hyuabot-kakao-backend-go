name: Deploy Kakao Backend

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      no-cache:
        description: Build Docker image without using cache
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: [self-hosted, Linux, ARM64, 1st]
    environment: production
    env:
      IMAGE_NAME: localhost:5000/hyuabot-kakao-backend-go:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true
          cleanup: false
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs['no-cache'] }}
      - name: Push Docker image
        run: docker push "${IMAGE_NAME}"
      - name: Sync image to worker registry
        uses: hyuabot-developers/hyuabot-infrastructure/.github/actions/sync-local-registry@a091ea37f391ae60eb7828325782a397cc7cae9c
        with:
          image: ${{ env.IMAGE_NAME }}
      - name: Restart Kakao backend
        run: kubectl -n hyuabot rollout restart deployment/hyuabot-chat-api
      - name: Wait for rollout
        run: kubectl -n hyuabot rollout status deployment/hyuabot-chat-api --timeout=180s
      - name: Verify healthcheck
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 http://127.0.0.1:30002/healthcheck
      - name: Clean local Docker image
        if: always()
        run: |
          docker image rm "${IMAGE_NAME}" || true
          docker image prune -f
